# Runs the MCP server over streamable HTTP, which is the transport hosted
# clients such as ChatGPT connectors expect.
#
#   docker compose up --build
#   -> http://127.0.0.1:8000/mcp
services:
  tsb-kasko-mcp:
    build:
      context: .
      dockerfile: .docker/python/Dockerfile
    image: tsb-kasko-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TSB_KASKO_TRANSPORT: http
      TSB_KASKO_HOST: 0.0.0.0
      TSB_KASKO_PORT: "8000"
      TSB_KASKO_CACHE_DIR: /home/kasko/.cache/tsb-kasko
    volumes:
      # Survives restarts, so brand and model lists are not refetched every time.
      - kasko-cache:/home/kasko/.cache/tsb-kasko
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  kasko-cache:
