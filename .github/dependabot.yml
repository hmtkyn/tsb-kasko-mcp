version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "respx", "pre-commit", "types-*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/.docker/python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
