# Local mirror of the CI pipeline: if these hooks pass, CI passes too.
#
#   uv run pre-commit install      # enable on this clone
#   uv run pre-commit run --all-files
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # mypy runs through uv so it type checks against the locked dependency
      # set instead of an isolated environment that lacks the stubs.
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src/tsb_kasko
        language: system
        types: [python]
        pass_filenames: false
